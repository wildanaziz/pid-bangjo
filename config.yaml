# Configuration for Vehicle Monitoring System

# CCTV Settings
cctv:
  location: "CCTV-Malang-01"
  video_source: "http://stream.cctv.malangkota.go.id/WebRTCApp/streams/982131430615781858979987.m3u8?token=null"
  # Alternative: use local video file
  # video_source: "./data/video/test.mp4"

# Model Settings
model:
  path: "yolov8m.pt"
  device: "cuda:0"  # or "cuda:0" for GPU
  confidence: 0.2
  classes: [2, 3, 5, 7]  # car, motorcycle, bus, truck

# Tracker Settings
tracker:
  reid_weights: "osnet_x0_25_msmt17.pt"
  device: "cuda:0"
  half: false

# Counting Line Settings
counting:
  line_position: 0.5  # 0.5 = middle of frame (0-1 range)
  counting_area_threshold: 15  # pixels
  count_only_right_half: true

# Output Settings
output:
  video_path: "output_pelacakan.mp4"
  codec: "mp4v"
  show_display: true
  max_frames: 0  # 0 for unlimited

# Kafka Settings
kafka:
  enabled: true
  servers:
    - "localhost:9092"
  topic: "vehicle-data"
  send_interval: 100  # Send data every N frames

# InfluxDB Settings
influxdb:
  url: "http://localhost:8086"
  token: "my-super-secret-token"
  org: "vehicle-monitoring"
  bucket: "vehicle-counts"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "logs/monitoring.log"
